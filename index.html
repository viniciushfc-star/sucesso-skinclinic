<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16213e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <title>SkinClinic</title>
  <link rel="stylesheet" href="./js/css/style.css?v=polish-4">
</head>
<body>

<div id="view-select-org" class="view hidden">
  <h2>Escolha a clínica</h2>
  <div id="orgList"></div>
</div>

<div id="view-login" class="view">
<div class="login-shell">
<div class="card login-card">

<div class="brand-lockup">
  <h1 class="brand-wordmark">SkinClinic</h1>
  <p class="brand-tagline">Beleza com propósito</p>
</div>

<p class="login-lead">Acesso ao sistema</p>

<form id="loginForm">

  <label class="field-label" for="email">Email</label>
  <input 
    type="email" 
    id="email" 
    placeholder="Digite seu email" 
    required
    autocomplete="username"
  >

  <label class="field-label" for="password">Senha</label>
  <div class="input-password-wrap">
    <input 
      type="password" 
      id="password" 
      placeholder="Digite sua senha" 
      required
      autocomplete="current-password"
    >
    <button type="button" class="input-password-toggle" id="togglePasswordLogin" aria-label="Mostrar senha" title="Mostrar senha">👁</button>
  </div>

  <button type="submit">
    Entrar
  </button>

  <button type="button" class="btn-secondary hidden" data-pwa-install>Adicionar à tela inicial</button>

</form>

<button id="btnGoogle" class="btn-google">
  <svg class="btn-google-icon" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.71A5.41 5.41 0 0 1 3.69 9c0-.59.1-1.17.28-1.71V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.04l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
  Entrar com Google
</button>

<button type="button" id="registerBtn" class="btn-secondary">
  Criar conta
</button>

<a href="reset.html" id="linkEsqueciSenha">Esqueci minha senha</a>

<p class="login-trust">Sistema profissional para administrar a clínica.</p>

</div>
</div>

<div id="registerModal" class="modal hidden">

  <div class="modal-content">

    <h2>Criar conta</h2>

  <form id="registerForm">

  <input 
    type="text" 
    id="name"
    placeholder="Nome completo"
    required
  >

  <input 
    type="email" 
    id="registerEmail"
    placeholder="Email"
    required
  >

  <input 
    type="text" 
    id="cpf"
    placeholder="CPF"
    required
  >

  <div class="input-password-wrap">
    <input 
      type="password" 
      id="registerPassword"
      placeholder="Senha (mín. 6 caracteres)"
      required
      minlength="6"
      autocomplete="new-password"
    >
    <button type="button" class="input-password-toggle" id="togglePasswordRegister" aria-label="Mostrar senha" title="Mostrar senha">👁</button>
  </div>

  <div class="input-password-wrap">
    <input 
      type="password" 
      id="confirmPassword"
      placeholder="Confirmar senha"
      required
      autocomplete="new-password"
    >
    <button type="button" class="input-password-toggle" id="togglePasswordConfirm" aria-label="Mostrar senha" title="Mostrar senha">👁</button>
  </div>

  <button type="submit">
    Criar conta
  </button>

  <p id="registerMsg"></p>

</form>

    <button id="closeModal" class="close">
      Fechar
    </button>



  </div>
</div>

<div id="view-master" class="view hidden">

 <h2>Painel Master</h2>

<div class="charts">

 <canvas id="chartFaturamento"></canvas>

 <canvas id="chartClientes"></canvas>

</div>

<h3>Comparativo entre clínicas</h3>

<table class="table">
 <thead>
  <tr>
   <th>Clínica</th>
   <th>Clientes</th>
   <th>Faturamento</th>
  </tr>
 </thead>
 <tbody id="compareTable"></tbody>
</table>

 <div>
  Usuários:
  <b id="totalUsers">0</b>
 </div>

 <h3>Convites Pendentes</h3>
 <ul id="listaConvites"></ul>

</div>

</div>
<!-- fim view-login -->

<div id="view-onboarding" class="view hidden">
  <p style="padding: 1rem;">Carregando…</p>
</div>
<div id="view-dashboard" class="view hidden"></div>


</div>


<script src="./js/core/boot-error.js"></script>
<script type="module" src="./js/views/login.views.js"></script>
<script type="module" src="./js/core/spa.js"></script>

</body>
</html>
