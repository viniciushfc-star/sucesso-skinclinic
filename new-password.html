<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nova senha</title>

  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./js/css/style.css?v=polish-4">
</head>
<body>

<div class="card login-card">

<div class="brand-lockup">
  <h1 class="brand-wordmark">SkinClinic</h1>
  <p class="brand-tagline">Beleza com propósito</p>
</div>

<p class="login-lead">Nova senha</p>
<p>Crie uma nova senha para sua conta</p>

<form id="newPasswordForm">

  <div class="input-password-wrap">
    <input 
      type="password" 
      id="password"
      placeholder="Nova senha (mín. 6 caracteres)"
      required
      minlength="6"
      autocomplete="new-password"
    >
    <button type="button" class="input-password-toggle" id="togglePasswordNew" aria-label="Mostrar senha" title="Mostrar senha">👁</button>
  </div>

  <div class="input-password-wrap">
    <input 
      type="password" 
      id="confirmPassword"
      placeholder="Confirmar nova senha"
      required
      autocomplete="new-password"
    >
    <button type="button" class="input-password-toggle" id="togglePasswordConfirmNew" aria-label="Mostrar senha" title="Mostrar senha">👁</button>
  </div>

  <button type="submit">
    Salvar nova senha
  </button>

  <p id="newPasswordMsg" role="status"></p>

</form>

<a href="./index.html">
  Voltar ao login
</a>

</div>

<script src="./js/core/boot-error.js"></script>
<script type="module"
src="./js/views/new-password.views.js">
</script>

</body>
</html>
