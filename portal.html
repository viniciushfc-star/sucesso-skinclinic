<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal do Cliente - SkinClinic</title>
  <meta name="theme-color" content="#0f5c62">
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./js/css/style.css?v=portal-ux-3" />
  <style>
    .client-completar-cadastro { max-width: 480px; margin: 1rem auto; padding: 1rem; }
    .client-completar-cadastro h2 { margin-bottom: 0.5rem; }
    .client-hint { color: #64748b; font-size: 0.9rem; margin-bottom: 1rem; }
    .client-completar-cadastro label { display: block; margin-top: 0.75rem; }
    .client-completar-cadastro input,
    .client-completar-cadastro select,
    .client-completar-cadastro textarea { width: 100%; padding: 0.5rem; margin-top: 0.25rem; }
    .client-completar-cadastro button[type="submit"] { margin-top: 1rem; }
    .client-header { text-align: center; padding: 2rem 1rem; }
    .client-header a { color: var(--sc-teal); }
    .client-termo-wrap { margin-top: 1.5rem; padding: 1rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; }
    .client-termo-title { margin: 0 0 0.5rem; font-size: 1rem; }
    .client-termo-resumo { margin: 0 0 0.75rem; padding: 0.5rem; background: #e0f2fe; border-radius: 6px; font-size: 0.9rem; color: #0c4a6e; }
    .client-termo-texto { max-height: 8rem; overflow-y: auto; padding: 0.5rem 0; font-size: 0.9rem; color: #475569; line-height: 1.45; }
    .client-termo-texto p { margin: 0 0 0.5rem; }
    .client-termo-check { display: flex; align-items: flex-start; gap: 0.5rem; margin-top: 0.75rem; cursor: pointer; font-size: 0.9rem; }
    .client-termo-check input { width: auto; margin: 0.2rem 0 0; flex-shrink: 0; }
    .portal-agenda-slots { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.75rem 0 1.25rem; }
    .portal-slot { padding: 0.4rem 0.65rem; border: 1px solid #cbd5e1; background: #fff; border-radius: 8px; cursor: pointer; }
    .portal-agenda-list { text-align: left; padding-left: 1rem; }
    .portal-agenda-list button { margin-left: 0.35rem; }
    [data-pwa-install] { margin: 0.75rem auto; display: block; }
    .portal-jornada { max-width: 520px; margin: 0 auto 1.5rem; padding: 0 1rem; text-align: left; }
    .portal-jornada-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.5rem; }
    .portal-jornada-btn { width: 100%; text-align: left; border: 1px solid var(--sc-line); background: var(--sc-surface); border-radius: var(--sc-radius); padding: 0.75rem 0.9rem; cursor: pointer; display: grid; gap: 0.15rem; }
    .portal-jornada-titulo { font-weight: 600; color: var(--sc-ink); }
    .portal-jornada-estado { font-size: 0.75rem; color: var(--sc-teal); }
    .portal-jornada-item--feito .portal-jornada-estado { color: var(--sc-ok); }
    .portal-jornada-item--pendente .portal-jornada-estado { color: var(--sc-warn); }
    .portal-mais { max-width: 520px; margin: 0 auto 1.5rem; padding: 0 1rem; }
    .portal-mais summary { cursor: pointer; color: var(--sc-ink-muted); font-size: 0.9rem; }
    .portal-mais .client-actions { margin-top: 0.75rem; }
    .portal-jornada-detalhe { font-size: 0.88rem; color: var(--sc-ink-muted); }
    .portal-proximo {
      max-width: 520px; margin: 0 auto 1rem; padding: 1rem 1.1rem;
      background: var(--sc-surface); border: 1px solid color-mix(in srgb, var(--sc-teal) 18%, #e8e2d8);
      border-radius: var(--sc-radius); text-align: left;
    }
    .portal-proximo-kicker {
      margin: 0 0 0.25rem; font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase; color: var(--sc-teal);
    }
    .portal-proximo-titulo { margin: 0 0 0.35rem; font-size: 1.2rem; color: var(--sc-ink); }
    .portal-proximo-detalhe { margin: 0 0 0.75rem; font-size: 0.9rem; color: var(--sc-ink-muted); }
    .portal-proximo .btn-primary { width: auto; }
    .portal-sessoes-resumo, .portal-acoes-principais {
      max-width: 520px; margin: 0 auto 1rem; padding: 0 1rem; text-align: left;
    }
    .portal-sessoes-resumo { color: var(--sc-ink-muted); font-size: 0.9rem; }
  </style>
</head>
<body class="portal-app">
  <main>
    <button type="button" class="hidden" data-pwa-install>Adicionar à tela inicial</button>
    <div id="app">Carregando...</div>
  </main>
  <script src="./js/core/boot-error.js"></script>
  <script type="module" src="./js/Client/portal.js?v=portal-login-1"></script>
</body>
</html>
